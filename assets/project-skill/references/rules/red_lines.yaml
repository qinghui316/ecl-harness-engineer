{
  "schema_version": "1.0",
  "rules": [
    {"id":"HR-01","severity":"critical","stages":["all"],"title":"Read Applicable Current State","rule":"Read critical rules and relevant project knowledge for every task. Before planning or editing repository mutations, also read the current workflow and Registry preflight; pure explanation, navigation, and source research do not require preflight.","on_violation":"Stop and load the applicable knowledge, workflow, and shared state before continuing."},
    {"id":"HR-02","severity":"critical","stages":["intake","plan","implement"],"title":"Structured Work Requires A Change","rule":"Cross-file, contract, architecture, permission, data, release, or multi-step work requires one Change and approved plan before implementation.","on_violation":"Return to intake or plan and obtain the project-native approval."},
    {"id":"HR-03","severity":"critical","stages":["plan","implement"],"title":"Publish High-Impact Contracts","rule":"API, schema, event, config, permission, and module-boundary changes must publish an evidence-backed Registry contract.","on_violation":"Stop implementation, publish the contract, and rerun preflight."},
    {"id":"HR-04","severity":"critical","stages":["implement","verify","integrate","evolve"],"title":"Preserve Project Integrity","rule":"Preserve unrelated user changes and never weaken or bypass existing project verification to make Harness work pass.","on_violation":"Stop, restore the intended scope without reverting user work, and report the affected gate."},
    {"id":"HR-05","severity":"critical","stages":["integrate"],"title":"User Controls Canonical Landing","rule":"Integration starts on an explicit user request and requires I2 bound to the exact independently reviewed candidate commit before landing business code to canonical.","on_violation":"Keep the Integration candidate pending and request review of the current candidate commit plus I2."},
    {"id":"HR-06","severity":"standard","stages":["close","integrate","evolve"],"title":"Keep Record Types Separate","rule":"Integration and Evolution records are not Changes and never count toward the five-Change window.","on_violation":"Recompute the eligible window from unique Change records."},
    {"id":"HR-07","severity":"standard","stages":["close","evolve"],"title":"Count Only Qualified Changes","rule":"Evolution eligibility requires completed, validation-passed, evidence-complete, non-abandoned unique Changes.","on_violation":"Exclude the record and repair its evidence or status before recounting."},
    {"id":"HR-08","severity":"standard","stages":["close","evolve"],"title":"Evolve At Five","rule":"Create pending at five unevaluated qualified Changes; Changes one through four do not start maintenance.","on_violation":"Leave ordinary work unblocked and restore the correct pending window."},
    {"id":"HR-09","severity":"critical","stages":["evolve"],"title":"Gate Evolution","rule":"Evolution requires E1, one writer owner, a proposal, independent score at least 80, no hard issue, and required validation.","on_violation":"Record rejected or noop and do not modify current Harness content."},
    {"id":"HR-10","severity":"standard","stages":["evolve"],"title":"Apply Passing Evolution Without E2","rule":"After E1, a proposal that passes every gate is applied automatically; unavailable independent review is noop.","on_violation":"Do not claim keep and preserve the pre-E1 content fingerprint."},
    {"id":"HR-11","severity":"critical","stages":["implement","integrate","evolve"],"title":"Protect Stable Project Knowledge","rule":"Workers and ordinary Integration publish evidence but do not rewrite shared L1/L2/L3 or global rules. Initialization, migration, and accepted Evolution own stable project Harness updates.","on_violation":"Move provisional facts to Change or Registry evidence and restore the stable shared owner."},
    {"id":"HR-12","severity":"standard","stages":["locate","close","evolve"],"title":"Bound Historical Loading","rule":"Load archive summaries through generated indexes and read deeper history only for a named resume, review, failure, or evolution question.","on_violation":"Stop bulk loading and return to the smallest relevant summary set."},
    {"id":"HR-13","severity":"standard","stages":["all"],"title":"Keep Coordination Local","rule":"Do not introduce daemons, remote locks, cross-machine synchronization, automatic Git initialization, or automatic business merges.","on_violation":"Remove the unsupported mechanism and report the local-only boundary."},
    {"id":"HR-15","severity":"critical","stages":["integrate"],"title":"Integrate Only Selected Commit Ranges","rule":"Apply each selected linear base_commit..completion_commit range; never merge a long-lived Lane tip as a whole.","on_violation":"Abort the candidate and rebuild it from the exact selected ranges."},
    {"id":"HR-16","severity":"standard","stages":["evolve"],"title":"Verify Evolution Mutation","rule":"Rejected and noop runs preserve the pre-E1 content fingerprint; keep must change it and pass project Harness validation.","on_violation":"Reject terminal publication until the fingerprint and decision agree."},
    {"id":"HR-17","severity":"critical","stages":["locate","plan","evolve"],"title":"Ground Semantic Bridges","rule":"L3 mappings require source code, manifest/configuration, tests, an integrated contract, or explicit user evidence; repository prose and search inference only locate candidates.","on_violation":"Remove the unsupported mapping or mark it unresolved."},
    {"id":"HR-18","severity":"standard","stages":["plan","verify","evolve"],"title":"Preserve Command Evidence Status","rule":"Commands remain configured, candidate, or executed with evidence; adapter defaults are never reported as configured project commands.","on_violation":"Downgrade the command to candidate or attach valid project evidence."},
    {"id":"HR-19","severity":"critical","stages":["integrate","evolve"],"title":"Use One Shared Writer","rule":"Integration finalization and Evolution publication must not overlap; acquire the atomic project Harness writer lock before shared mutation.","on_violation":"Stop and wait for or repair the existing owner claim."},
    {"id":"HR-20","severity":"standard","stages":["evolve"],"title":"Keep One Rule Source","rule":"Edit red_lines.yaml only, then regenerate critical and by-stage Markdown; never hand-edit derived rule views.","on_violation":"Regenerate derived views and discard manual divergence."},
    {"id":"HR-21","severity":"critical","stages":["locate","verify","evolve"],"title":"Keep Knowledge Inspection Read Only","rule":"Knowledge scan and check only report drift. Stable Wiki application is restricted to initialization, migration, or an accepted E1 Evolution candidate.","on_violation":"Stop the inspection, preserve current Wiki content, and move the proposed update into the authorized analysis bundle flow."},
    {"id":"HR-22","severity":"critical","stages":["all"],"title":"Prioritize Current Facts Over Periodic Wiki","rule":"When baseline events or source drift affect the current scope, Registry contracts and events, shared current Change evidence, and repository code/manifests/configuration/tests/interfaces override periodic L1/L2/L3; stop and replan with refresh-needed.","on_violation":"Discard the stale Wiki assumption, reload higher-priority current evidence, and revise the Change plan before continuing."},
    {"id":"HR-23","severity":"standard","stages":["intake"],"title":"Bound Clarification Rounds","rule":"Ask at most three high-impact questions in one round; record low-risk unknowns as assumptions and block only on unresolved high-impact unknowns.","on_violation":"Stop the interview, preserve answered decisions, and ask only the remaining material questions in a later round."},
    {"id":"HR-24","severity":"critical","stages":["bootstrap-project"],"title":"Bootstrap Business Code Through A Change","rule":"Create greenfield source, project commands, documentation, Make or CI only after purpose, stack, application type, and acceptance are confirmed in an approved Structured Change.","on_violation":"Stop business-project generation and return to bootstrap spec and plan review."},
    {"id":"HR-25","severity":"critical","stages":["integrate"],"title":"Detach Shared Harness Links Before Worktree Removal","rule":"Before removing a secondary worktree, verify that its Codex and Claude Skill links target the marked physical project Harness, then detach those link nodes without following their target.","on_violation":"Stop worktree removal, preserve the worktree and physical project Harness, and report the unverifiable or conflicting path."}
  ]
}
